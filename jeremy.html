<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jeremy</title>
  <meta name="theme-color" content="#efe6d6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --plaster: #efe6d6;
      --paper: #f7f3ea;
      --ink: #1c140e;
      --rust: #b84a22;
      --muted: #6e6256;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--plaster);
      color: var(--ink);
      font-family: "Manrope", system-ui, sans-serif;
      overflow-x: hidden;
    }
    button {
      cursor: pointer;
      font: inherit;
      border: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2.5rem 1.25rem;
      max-width: 32rem;
      margin: 0 auto;
    }
    .ticker-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.5rem 0;
      opacity: 0.25;
      overflow: hidden;
    }
    .ticker {
      white-space: nowrap;
      font-family: "Anton", Impact, sans-serif;
      font-size: 2.25rem;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      width: max-content;
      animation: ticker 22s linear infinite;
    }
    .ticker.reverse { animation-direction: reverse; }
    .ticker span { padding-right: 2rem; }
    @keyframes ticker {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    .label {
      position: relative;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--rust);
    }
    .photo-btn {
      position: relative;
      width: 100%;
      max-width: 20rem;
      border: 4px solid var(--ink);
      border-radius: 0.375rem;
      background: var(--paper);
      box-shadow: 8px 8px 0 0 var(--ink);
      overflow: hidden;
      padding: 0;
    }
    .photo-btn.pop {
      animation: pop 280ms ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.98) rotate(-0.4deg); }
      40% { transform: scale(1.02) rotate(0.6deg); }
      100% { transform: scale(1) rotate(0); }
    }
    .photo-btn img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: top;
    }
    .photo-btn .caption {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: rgba(28, 20, 14, 0.85);
      color: var(--paper);
      font-family: "Anton", Impact, sans-serif;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.5rem 0.75rem;
    }
    .lines {
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
    }
    .lines .big {
      font-family: "Anton", Impact, sans-serif;
      font-size: clamp(2.5rem, 12vw, 3.75rem);
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin: 0;
    }
    .lines .small {
      font-family: "Anton", Impact, sans-serif;
      font-size: 1.5rem;
      line-height: 1;
      text-transform: uppercase;
      color: var(--rust);
      margin: 0;
    }
    .lines .extra {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--muted);
      margin: 0;
    }
    .shout {
      position: relative;
      min-height: 3rem;
      border-radius: 9999px;
      border: 2px solid var(--ink);
      background: var(--rust);
      color: var(--paper);
      font-weight: 800;
      font-size: 0.875rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.75rem 1.5rem;
      box-shadow: 4px 4px 0 0 var(--ink);
    }
    .shout:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 0 var(--ink);
    }
    .count {
      position: relative;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      margin: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .ticker, .photo-btn.pop { animation: none; }
    }
  </style>
</head>

    <div class="ticker" id="ticker-a"></div>
    <div class="ticker reverse" id="ticker-b"></div>
  </div>

      <span class="caption">Jeremy es gay</span>
    </button>

    <div class="lines" id="lines"></div>

    <button type="button" class="shout" id="shout-btn">Otra vez</button>
    <p class="count" id="count">Dicho 2 veces</p>
  </main>

  <script>
    const SPOKEN = "Jeremy es gay";
    const PHRASE = "JEREMY ES GAY";
    let count = 2;
    let pulse = 0;

    const loop = Array.from({ length: 12 }, () => PHRASE).join("   ·   ");
    for (const id of ["ticker-a", "ticker-b"]) {
      const el = document.getElementById(id);
      el.innerHTML = "<span>" + loop + "</span><span>" + loop + "</span>";
    }

    function renderLines() {
      const box = document.getElementById("lines");
      const n = Math.min(count, 8);
      let html = "";
      for (let i = 0; i < n; i++) {
        html += '<p class="' + (i === 0 ? "big" : "small") + '">Jeremy es gay</p>';
      }
      if (count > 8) {
        html += '<p class="extra">y ' + (count - 8) + " veces más</p>";
      }
      box.innerHTML = html;
      document.getElementById("count").textContent = "Dicho " + count + " veces";
    }

    function speakJeremy() {
      if (!window.speechSynthesis) return;
      const synth = window.speechSynthesis;
      const utter = new SpeechSynthesisUtterance(SPOKEN);
      utter.lang = "es-MX";
      utter.rate = 1;
      const voices = synth.getVoices();
      const voice =
        voices.find((v) => v.lang.toLowerCase().startsWith("es-mx")) ||
        voices.find((v) => v.lang.toLowerCase().startsWith("es"));
      if (voice) utter.voice = voice;
      synth.cancel();
      synth.speak(utter);
    }

    function shout() {
      count += 1;
      pulse += 1;
      const btn = document.getElementById("photo-btn");
      btn.classList.remove("pop");
      void btn.offsetWidth;
      btn.classList.add("pop");
      renderLines();
      speakJeremy();
    }

    document.getElementById("photo-btn").addEventListener("click", shout);
    document.getElementById("shout-btn").addEventListener("click", shout);

    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
    }

    renderLines();
  </script>
